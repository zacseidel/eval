name: Update Portfolio Data

on:
  schedule:
    # Run at 7am MDT Tue/Fri (6am MST in winter), two hours after Momentum.
    - cron: '0 13 * * 2,5'
  workflow_dispatch: # allow manual runs from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v
          npm test

      - name: Run scraper
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python scraper/main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Raw report snapshots are part of the audit trail and must be
          # committed with the outputs generated from them.
          git add data/scraped/ data/processed/ data/price_cache/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update portfolio data [skip ci]"
          git pull --rebase
          git push
