name: Update Portfolio Data

on:
  schedule:
    # Run after the US close: 7pm MDT Tue/Fri (6pm MST in winter).
    - cron: '0 1 * * 3,6'
  workflow_dispatch: # allow manual runs from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run scraper
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python scraper/main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Raw report snapshots are part of the audit trail and must be
          # committed with the outputs generated from them.
          git add data/scraped/ data/processed/ data/price_cache/
          git diff --cached --quiet && exit 0
          git commit -m "chore: update portfolio data [skip ci]"
          git pull --rebase
          git push
